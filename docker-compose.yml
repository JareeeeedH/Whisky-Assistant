services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: whiskey
      POSTGRES_PASSWORD: whiskey
      POSTGRES_DB: whiskey
    ports:
      # 本機 5432、5433 已被其他專案的資料庫占用
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 只在資料庫第一次初始化時執行；之後改 schema 要先刪掉 volume
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
